[project]
name = "prueba-ingenieria-datos"
version = "0.1.0"
description = "Pipeline ETL con Apache Airflow y Data Warehouse para DataMart S.A.S."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.0",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
]

[project.urls]
Repository = "https://github.com/JoshuaQ-rJ/repositorio_prueba_ingenieria"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
